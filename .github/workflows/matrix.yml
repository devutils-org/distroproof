name: Matrice

# Dogfooding : distroproof lance envprobe dans des VM de chaque distro cible
# (distroproof.toml) et publie un résumé Markdown sur la PR.

on:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  pull-requests: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Installer QEMU et OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target x86_64-unknown-linux-musl

      # Images cloud et noyaux extraits : renouvelés chaque semaine pour
      # suivre les mises à jour des distros.
      - id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/distroproof/images
          key: distroproof-images-${{ steps.week.outputs.week }}-${{ hashFiles('distroproof.toml') }}
          restore-keys: distroproof-images-

      - name: Lancer la matrice
        run: |
          set +e
          target/x86_64-unknown-linux-musl/release/distroproof up --no-tui --jobs 3 \
            --json matrix.json --junit junit.xml --markdown summary.md
          echo "code=$?" >> "$GITHUB_ENV"

      - name: Résumé
        if: always()
        run: cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commentaire de PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body-file summary.md \
            --edit-last --create-if-none

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distroproof-matrix
          path: |
            matrix.json
            junit.xml
            summary.md

      - name: Code de sortie de la matrice
        run: exit "$code"
