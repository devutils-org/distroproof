name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Vérifier que le binaire est statique
        run: |
          bin=target/x86_64-unknown-linux-musl/release/envprobe
          file "$bin"
          file "$bin" | grep -Eq 'statically linked|static-pie linked'
          ! ldd "$bin" 2>&1 | grep -q '=>'
      - run: target/x86_64-unknown-linux-musl/release/envprobe --version
      - uses: actions/upload-artifact@v4
        with:
          name: envprobe-x86_64-linux-musl
          path: target/x86_64-unknown-linux-musl/release/envprobe
