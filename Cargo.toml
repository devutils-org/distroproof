[workspace]
resolver = "2"
members = ["crates/envprobe-core", "crates/envprobe", "crates/distroproof"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/devutils-org/distroproof"

[workspace.dependencies]
envprobe-core = { path = "crates/envprobe-core" }
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
libc = "0.2"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.58", default-features = false }
ratatui = "0.30"
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "net", "io-util", "time", "sync", "signal", "fs"] }
toml = "1"
tui-term = "0.3"
vt100 = "0.16"

# Keeps image hashing (several hundred MiB) fast in debug builds.
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
